name: Build signed iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'codex/ios-local-build'

permissions:
  contents: read

concurrency:
  group: ios-local-production
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sms-filter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          echo "Active iphoneos SDK: $sdk_version"
          if (( sdk_major < 26 )); then
            echo "SDK major version must be 26 or newer" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sms-filter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Install EAS CLI
        run: npm install --global eas-cli@21.6.0

      - name: Build signed production IPA locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --freeze-credentials \
            --output "$GITHUB_WORKSPACE/FiltreAI.ipa"

      - name: Verify IPA contract
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          unzip -q "$GITHUB_WORKSPACE/FiltreAI.ipa" -d "$verify_dir"
          app="$verify_dir/Payload/FiltreAI.app"
          report_extension="$app/PlugIns/smsreport.appex"

          test -d "$report_extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "1.0.8"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:ILClassificationExtensionSMSReportDestination' "$report_extension/Info.plist")" = "+905438260667"
          strings "$app/FiltreAI" | grep -F "ExtensionStorage" >/dev/null
          strings "$app/main.jsbundle" | grep -F "smsfilter_report_event_queue_json" >/dev/null
          strings "$report_extension/smsreport" | grep -F "smsfilter_report_event_queue_json" >/dev/null
          strings "$app/main.jsbundle" | grep -F "smsfilter_pending_sender_override_queue_json" >/dev/null
          strings "$report_extension/smsreport" | grep -F "smsfilter_pending_sender_override_queue_json" >/dev/null
          strings "$app/main.jsbundle" | grep -F "getFiles" >/dev/null
          strings "$report_extension/smsreport" | grep -F "smsfilter_pending_sender_override_" >/dev/null

          security cms -D -i "$app/embedded.mobileprovision" > "$verify_dir/app-profile.plist"
          security cms -D -i "$report_extension/embedded.mobileprovision" > "$verify_dir/report-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$verify_dir/app-profile.plist" | grep -Fx "group.com.filtreai.app" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$verify_dir/report-profile.plist" | grep -Fx "group.com.filtreai.app" >/dev/null

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: FiltreAI-iOS-production
          path: FiltreAI.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Submit to App Store Connect / TestFlight
        if: github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --path "$GITHUB_WORKSPACE/FiltreAI.ipa" \
            --non-interactive
